name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller only
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Ensure folders
        shell: pwsh
        run: |
          if (!(Test-Path data)) { New-Item -ItemType Directory -Path data | Out-Null }
          if (!(Test-Path data\.gitkeep)) { Set-Content -Path data\.gitkeep -Value '' }
          if (!(Test-Path www\rolling-mill-system.html)) { throw 'www/rolling-mill-system.html missing' }

      - name: Build EXE (no pywebview)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name RollingMill `
            --add-data "www;www" `
            --add-data "data;data" `
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RollingMill-Windows
          path: dist/RollingMill
